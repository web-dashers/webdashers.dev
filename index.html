<base id="baseTag" href="https://web-dashers.github.io/">
<script>
    launch();
    // single file made by Martin_MMC aka Marty Games
    function launch() {
        const baseHref = document.getElementById("baseTag").href;

        try {
            fetch("https://web-dashers.github.io/index.html?t=" + Date.now())
                .then(res => res.text())
                .then(html => {
                    // inject <base> directly into <head> BEFORE parsing
                    if (html.includes("<head>")) {
                        html = html.replace(
                            "<head>",
                            `<head><base href="${baseHref}">`
                        );
                    } else {
                        // fallback if no <head>
                        html = `<base href="${baseHref}">` + html;
                    }

                    // replace document
                    document.open();
                    document.write(html);
                    document.close();
                });
        } catch (error) {
            console.error("error:", error);
        }
    }
</script>
